# /etc/tmpfiles.d/chromium-sbx.conf : dossier de passage entre la session et le compte chromium.
# Propriétaire : l'utilisateur de session, qui y crée les sockets (Wayland, D-Bus, son).
# Groupe chromium + setgid : ces sockets prennent le groupe chromium sans que la session
# ait besoin d'en être membre ; les autres comptes ne peuvent pas entrer.
d /run/chromium-sbx 2750 timothe chromium -
