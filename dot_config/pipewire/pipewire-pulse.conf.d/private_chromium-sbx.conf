# ~/.config/pipewire/pipewire-pulse.conf.d/chromium-sbx.conf
# Socket son supplémentaire pour Chromium (compte chromium), dans le dossier de passage
# /run/chromium-sbx. Accès « restricted » : WirePlumber ne donne que lecture et exécution
# (Perm.RX) aux clients de ce socket. Chromium joue ses propres flux, mais ne peut ni
# modifier les autres flux ni régler les périphériques.
# Redéfinir server.address remplace la liste par défaut : garder "unix:native".
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:/run/chromium-sbx/pulse" client.access = "restricted" }
    ]
}
