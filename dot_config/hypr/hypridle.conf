# hypridle — non lancé : inactivité et verrouillage gérés par caelestia (shell.json general.idle).
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # lock_cmd désactivé : le verrouillage est géré par caelestia (Lock.qml + LogindManager), deux lockers en parallèle faisaient planter Hyprland à la veille/réveil
    # before_sleep_cmd désactivé : caelestia verrouille déjà avant la veille (general.idle.lockBeforeSleep)
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'  # rallume l'écran après la veille
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# turn off screen faster if session is already locked

# Warn
listener {
    timeout = 540                     # 9 min
    on-timeout = notify-send -i $iDIR " You are idle!" # command to run when timeout has passed
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"  # command to run when activity is detected after timeout has fired.
}

# Screenlock
listener {
    timeout = 600                     # 10 min
    # on-timeout = loginctl lock-session   # désactivé : délais d inactivité gérés par caelestia (shell.json general.idle.timeouts)
}

# Turn off screen 

