# /* ---- 💫 JaKooLit + Caelestia-Shell Integration 💫 ---- */  #
# Ce fichier contient UNIQUEMENT les binds spécifiques à caelestia (IPC/global).
# Les binds d'apps (kitty, nautilus, vicinae) restent dans UserKeybinds.conf.

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts

# ─── Restart caelestia shell ──────────────────────────────────────────────────
# Ne PAS revenir a `pkill -f quickshell` : le binaire s'appelle `qs`, donc le
# motif ne matche jamais le shell. Pire, `pkill -f` compare la ligne de commande
# complete, et le mot "quickshell" est present dans la ligne du sh qui execute
# ce bind : pkill se tuait lui-meme et le restart n'arrivait jamais.
# `qs kill` passe par le registre d'instances de quickshell, pas par un pattern.
bind = CTRL $mainMod SHIFT, R, exec, qs kill -c caelestia; sleep 0.3; qs -c caelestia -d

# ─── Caelestia IPC (actifs uniquement quand caelestia tourne) ─────────────────
# Unbind default workspace switchers to prevent conflicts
unbind = $mainMod, tab
unbind = $mainMod SHIFT, tab

# Switcher / Task View (SUPER + TAB)
bind = $mainMod, tab, global, caelestia:overview

# Dashboard / Sidebar (SUPER + Shift + TAB)
bind = $mainMod SHIFT, tab, global, caelestia:sidebar

# Toggle Bar position (SUPER + ALT + B)
#bind = $mainMod ALT, B, exec, caelestia shell drawers toggle barIsTop

# Clear notifications
bind = $mainMod SHIFT, N, global, caelestia:clearNotifs

# ─── Unbind des touches multimedia JaKooLit ───────────────────────────────────
# configs/Keybinds.conf (42-55) et UserConfigs/Laptops.conf (18-19) bindent ces
# touches sur Volume.sh / Brightness.sh / MediaCtrl.sh, qui envoient un
# notify-send. Comme caelestia affiche deja son OSD sur ces memes touches, on se
# retrouvait avec notification + OSD en double. En prime Brightness.sh cherche
# ses icones dans ~/.config/swaync/icons (swaync n'est pas installe), d'ou les
# notifications sans logo. On retire les binds JaKooLit, caelestia reprend juste
# en dessous.
unbind = , xf86audioraisevolume
unbind = , xf86audiolowervolume
unbind = , xf86audiomute
unbind = , xf86AudioMicMute
unbind = , xf86MonBrightnessUp
unbind = , xf86MonBrightnessDown
unbind = , xf86AudioPlayPause
unbind = , xf86AudioPause
unbind = , xf86AudioPlay
unbind = , xf86AudioNext
unbind = , xf86AudioPrev
unbind = , xf86audiostop

# ─── Media Controls via caelestia ─────────────────────────────────────────────
bindl = CTRL $mainMod, Space, global, caelestia:mediaToggle
bindl = CTRL $mainMod, Equal, global, caelestia:mediaNext
bindl = CTRL $mainMod, Minus, global, caelestia:mediaPrev
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# ─── Brightness via caelestia ─────────────────────────────────────────────────
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown
bindel = , XF86AudioRaiseVolume, global, caelestia:volumeUp
bindel = , XF86AudioLowerVolume, global, caelestia:volumeDown
bindl  = , XF86AudioMute, global, caelestia:volumeMute

# Mute micro : caelestia n'expose pas de global pour ca. On passe par wpctl.
# Le service Audio de caelestia surveille le noeud PipeWire, donc l'OSD
# s'affiche quand meme sur changement de sourceMuted.
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
