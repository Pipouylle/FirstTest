[mgr]
prepend_keymap = [
  # Z : zippe la sélection (ou le fichier survolé). Le nom "archive" est
  # pré-rempli et modifiable, %s est remplacé par les fichiers à la validation.
  { on = "Z", run = 'shell --interactive --block --cursor=43 "~/.config/hypr/UserScripts/yazi-zip archive %s"', desc = "Zip la sélection (nom modifiable)" },
  # C : Claude Code (clb) dans le dossier affiché. keepass-tokens directement : l'alias clb
  # et la fonction claude n'existent que dans zsh interactif, sinon le token KeePass est contourné.
  { on = "C", run = 'shell --block "keepass-tokens claude --dangerously-skip-permissions"', desc = "Claude Code dans ce dossier" },
  # U : dézippe chaque archive sélectionnée dans un dossier du même nom
  { on = "U", run = 'shell --block "~/.config/hypr/UserScripts/yazi-unzip %s"', desc = "Unzip dans un dossier du même nom" },
]
